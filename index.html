<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 鎖定放大比例，防止 iPhone 自動亂放大 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LifeTracker</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 隱藏滾動條但保留滾動功能 */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    html, body, #root { height: 100%; width: 100%; margin: 0; padding: 0; overflow-x: hidden; }
    
    /* 確保所有輸入框在 iOS Safari 不會觸發自動放大 (字體 >= 16px) */
    input, textarea, select { font-size: 16px !important; }
  </style>
</head>
<body class="bg-slate-50 antialiased text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- 輔助函數 ---
    const getTodayString = () => {
      const today = new Date();
      return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    };

    const getFormattedDate = () => {
      const options = { month: 'long', day: 'numeric', weekday: 'long' };
      return new Date().toLocaleDateString('zh-TW', options);
    };

    const getGreeting = () => {
      const hour = new Date().getHours();
      if (hour < 5) return '夜深了，早點休息';
      if (hour < 12) return '早安，充滿活力';
      if (hour < 18) return '午安，繼續加油';
      return '晚安，放鬆一下';
    };

    // --- 自訂圖示渲染組件 (修復圖示消失問題) ---
    const Icon = ({ name, size = 24, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide) {
          // 將圖示名稱轉換格式以匹配 Lucide
          let iconName = name;
          // 將 kebab-case 轉換為 PascalCase
          const pascalName = name.split('-').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join('');
          
          let iconObj = window.lucide.icons[pascalName] || window.lucide.icons[name];
          
          if (iconObj) {
            const svg = window.lucide.createElement(iconObj);
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.setAttribute('stroke-width', 2.5);
            iconRef.current.innerHTML = '';
            iconRef.current.appendChild(svg);
          } else {
              console.warn(`Icon ${name} not found`);
          }
        }
      }, [name, size]);
      return <span ref={iconRef} className={`inline-flex items-center justify-center shrink-0 ${className}`} style={{ width: size, height: size }}></span>;
    };

    // --- 選項常數 ---
    const MOODS = [
      { value: 1, emoji: '😭', label: '極差' },
      { value: 2, emoji: '😕', label: '不好' },
      { value: 3, emoji: '😐', label: '平靜' },
      { value: 4, emoji: '🙂', label: '不錯' },
      { value: 5, emoji: '🤩', label: '極佳' }
    ];

    const MIGRAINE_LEVELS = [
      { value: 0, label: '無', color: 'bg-emerald-50 text-emerald-600 border-emerald-200 hover:bg-emerald-100' },
      { value: 1, label: '輕微', color: 'bg-amber-50 text-amber-600 border-amber-200 hover:bg-amber-100' },
      { value: 2, label: '中度', color: 'bg-orange-50 text-orange-600 border-orange-200 hover:bg-orange-100' },
      { value: 3, label: '嚴重', color: 'bg-rose-50 text-rose-600 border-rose-200 hover:bg-rose-100' }
    ];

    const BEVERAGE_OPTIONS = [
      { id: 'milktea', label: '奶茶', emoji: '🧋' },
      { id: 'coffee', label: '咖啡', emoji: '☕' },
      { id: 'fruit_tea', label: '果茶', emoji: '🍹' }
    ];

    // --- 主程式 ---
    function App() {
      const [activeTab, setActiveTab] = useState('today');
      const [isLoading, setIsLoading] = useState(true);
      const [weather, setWeather] = useState({ temp: '--', text: '載入中', code: 0 });

      // 本地存儲存取邏輯
      const STORAGE_KEY_PREFIX = 'lifetracker_local_';
      const saveData = (key, data) => {
        try { localStorage.setItem(`${STORAGE_KEY_PREFIX}${key}`, JSON.stringify(data)); } 
        catch (e) { console.error("Local storage save error", e); }
      };
      const loadData = (key, defaultData) => {
        try {
          const saved = localStorage.getItem(`${STORAGE_KEY_PREFIX}${key}`);
          return saved ? JSON.parse(saved) : defaultData;
        } catch (e) { return defaultData; }
      };

      // 數據狀態
      const [todayLog, setTodayLog] = useState({ 
        mood: 0, migraine: 0, sleepHours: '', diary: '', completedHabits: [],
        hadBeverage: 'none', beverageName: '', beverageTime: ''
      });
      const [todos, setTodos] = useState([]);
      const [habits, setHabits] = useState([]);
      const [plans, setPlans] = useState([]);
      const [allLogs, setAllLogs] = useState([]);
      const [diaries, setDiaries] = useState([]); 

      const [showAllHealthLogs, setShowAllHealthLogs] = useState(false);
      const [showAllDiaries, setShowAllDiaries] = useState(false);

      const [newItemType, setNewItemType] = useState('habit');
      const [newItemText, setNewItemText] = useState('');
      const [newPlan, setNewPlan] = useState('');
      const [saveStatus, setSaveStatus] = useState('');
      const [diaryInput, setDiaryInput] = useState(''); 
      const [editingDiaryId, setEditingDiaryId] = useState(null); 
      const [medicationInput, setMedicationInput] = useState('');
      const [migraineTimeInput, setMigraineTimeInput] = useState('');
      const [migraineTriggerInput, setMigraineTriggerInput] = useState('');
      const [beverageTimeInput, setBeverageTimeInput] = useState('');

      const todayStr = getTodayString();

      // 初始化載入資料
      useEffect(() => {
        const loadedLogs = loadData('daily_logs', []);
        setAllLogs(loadedLogs);
        
        const todayData = loadedLogs.find(l => l.id === todayStr) || { 
          id: todayStr, mood: 0, migraine: 0, sleepHours: '', completedHabits: [], hadBeverage: 'none', beverageName: '', beverageTime: ''
        };
        setTodayLog(todayData);

        setTodos(loadData('todos', []));
        setHabits(loadData('habits', []));
        setPlans(loadData('plans', []));
        setDiaries(loadData('diaries', []));
        setIsLoading(false);
      }, []);

      // 儲存邏輯
      useEffect(() => {
        if(isLoading) return;
        const newLogs = allLogs.filter(l => l.id !== todayStr);
        newLogs.push({...todayLog, id: todayStr});
        setAllLogs(newLogs.sort((a, b) => b.id.localeCompare(a.id)));
        saveData('daily_logs', newLogs);
      }, [todayLog]);

      useEffect(() => { if(!isLoading) saveData('todos', todos); }, [todos]);
      useEffect(() => { if(!isLoading) saveData('habits', habits); }, [habits]);
      useEffect(() => { if(!isLoading) saveData('plans', plans); }, [plans]);
      useEffect(() => { if(!isLoading) saveData('diaries', diaries); }, [diaries]);

      // 載入天氣
      useEffect(() => {
        const fetchWeather = async (lat = 25.0330, lon = 121.5654) => {
          try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            const current = data.current_weather;
            if (current) {
              const code = current.weathercode;
              let text = '晴朗';
              if ([1, 2].includes(code)) text = '多雲時晴';
              else if (code === 3) text = '陰天';
              else if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) text = '降雨';
              else if ([95, 96, 99].includes(code)) text = '雷雨';
              setWeather({ temp: Math.round(current.temperature), text, code });
            }
          } catch {
            setWeather({ temp: '26', text: '晴朗', code: 0 });
          }
        };

        if ('geolocation' in navigator) {
          navigator.geolocation.getCurrentPosition(
            (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude),
            () => fetchWeather()
          );
        } else {
          fetchWeather();
        }
      }, []);

      useEffect(() => {
        setMedicationInput(todayLog.migraineMedication || '');
        setMigraineTimeInput(todayLog.migraineStartTime || '');
        setMigraineTriggerInput(todayLog.migraineTrigger || '');
        setBeverageTimeInput(todayLog.beverageTime || '');
      }, [todayLog.migraineMedication, todayLog.migraineStartTime, todayLog.migraineTrigger, todayLog.beverageTime]);

      const updateTodayLog = (field, value) => {
        setTodayLog(prev => ({ ...prev, [field]: value }));
      };

      const selectBeverage = (beverageLabel) => {
        setTodayLog(prev => ({ ...prev, hadBeverage: 'drank', beverageName: beverageLabel }));
      };

      const saveDiary = () => {
        if (!diaryInput.trim()) return;
        setSaveStatus('儲存中...');
        
        if (editingDiaryId) {
           setDiaries(prev => prev.map(d => d.id === editingDiaryId ? { ...d, text: diaryInput.trim(), updatedAt: Date.now() } : d));
           setEditingDiaryId(null);
        } else {
           const newDiary = { id: Date.now().toString(), text: diaryInput.trim(), date: todayStr, createdAt: Date.now() };
           setDiaries(prev => [newDiary, ...prev]);
        }
        
        setDiaryInput('');
        setSaveStatus('已儲存');
        setTimeout(() => setSaveStatus(''), 3000);
      };

      const editDiary = (diary) => {
        setDiaryInput(diary.text);
        setEditingDiaryId(diary.id);
        window.scrollTo({ top: 0, behavior: 'smooth' }); 
      };

      const deleteDiaryItem = (id) => { setDiaries(prev => prev.filter(d => d.id !== id)); };

      const addItem = (e) => {
        e.preventDefault();
        if (!newItemText.trim()) return;
        if (newItemType === 'todo') {
           setTodos(prev => [{ id: Date.now().toString(), text: newItemText.trim(), completed: false, createdAt: Date.now(), date: todayStr }, ...prev]);
        } else {
           setHabits(prev => [...prev, { id: Date.now().toString(), text: newItemText.trim(), createdAt: Date.now() }]);
        }
        setNewItemText('');
      };

      const toggleHabit = (habitId) => {
        const currentCompleted = todayLog.completedHabits || [];
        const newCompleted = currentCompleted.includes(habitId) ? currentCompleted.filter(id => id !== habitId) : [...currentCompleted, habitId];
        updateTodayLog('completedHabits', newCompleted);
      };

      const deleteHabit = (id) => { setHabits(prev => prev.filter(h => h.id !== id)); };
      const toggleTodo = (id) => { setTodos(prev => prev.map(t => t.id === id ? { ...t, completed: !t.completed } : t)); };
      const deleteTodo = (id) => { setTodos(prev => prev.filter(t => t.id !== id)); };

      const addPlan = (e) => {
        e.preventDefault();
        if (!newPlan.trim()) return;
        setPlans(prev => [{ id: Date.now().toString(), title: newPlan.trim(), progress: 0, createdAt: Date.now() }, ...prev]);
        setNewPlan('');
      };
      const updatePlanProgress = (id, progress) => { setPlans(prev => prev.map(p => p.id === id ? { ...p, progress } : p)); };
      const deletePlan = (id) => { setPlans(prev => prev.filter(p => p.id !== id)); };

      const handleExport = () => {
        const exportData = {
          daily_logs: allLogs, todos: todos, habits: habits, plans: plans, diaries: diaries,
          exportDate: new Date().toISOString()
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", `LifeTracker_Backup_${getTodayString()}.json`);
        document.body.appendChild(downloadAnchorNode); 
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
        alert("資料已成功打包成檔案並下載！請儲存好這個檔案。");
      };

      const handleImport = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const importedData = JSON.parse(e.target.result);
            if(importedData.daily_logs) {
              setAllLogs(importedData.daily_logs);
              const todayData = importedData.daily_logs.find(l => l.id === todayStr) || { 
                id: todayStr, mood: 0, migraine: 0, sleepHours: '', completedHabits: [], hadBeverage: 'none', beverageName: '', beverageTime: ''
              };
              setTodayLog(todayData);
            }
            if(importedData.todos) setTodos(importedData.todos);
            if(importedData.habits) setHabits(importedData.habits);
            if(importedData.plans) setPlans(importedData.plans);
            if(importedData.diaries) setDiaries(importedData.diaries);
            alert("備份資料還原成功！");
          } catch (error) {
            alert("還原失敗，請確定選擇了正確的 JSON 備份檔案。");
          }
        };
        reader.readAsText(file);
        event.target.value = '';
      };

      const insights = useMemo(() => {
        if (allLogs.length === 0) return null;
        let totalSleep = 0, sleepCount = 0, migraineDays = 0, moodSum = 0, moodCount = 0;
        let sleepWithMigraine = [], sleepWithoutMigraine = [];

        allLogs.forEach(log => {
          const sleep = parseFloat(log.sleepHours);
          if (!isNaN(sleep) && sleep > 0) {
            totalSleep += sleep; sleepCount++;
            if (log.migraine > 0) sleepWithMigraine.push(sleep);
            else sleepWithoutMigraine.push(sleep);
          }
          if (log.migraine > 0) migraineDays++;
          if (log.mood > 0) { moodSum += log.mood; moodCount++; }
        });

        return {
          totalDays: allLogs.length,
          avgSleep: sleepCount > 0 ? (totalSleep / sleepCount).toFixed(1) : 0,
          migraineRate: Math.round((migraineDays / allLogs.length) * 100) || 0,
          avgMood: moodCount > 0 ? (moodSum / moodCount).toFixed(1) : 0,
          correlation: { 
            avgSleepMigraine: sleepWithMigraine.length > 0 ? (sleepWithMigraine.reduce((a,b)=>a+b,0) / sleepWithMigraine.length).toFixed(1) : '無數據', 
            avgSleepNoMigraine: sleepWithoutMigraine.length > 0 ? (sleepWithoutMigraine.reduce((a,b)=>a+b,0) / sleepWithoutMigraine.length).toFixed(1) : '無數據' 
          }
        };
      }, [allLogs]);

      const renderWeatherIcon = () => {
        const code = weather.code;
        if ([95, 96, 99].includes(code)) return <Icon name="cloud-lightning" size={28} className="text-indigo-500" />;
        if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return <Icon name="cloud-rain" size={28} className="text-blue-500" />;
        if (code === 3) return <Icon name="cloud" size={28} className="text-slate-400" />;
        if ([1, 2].includes(code)) return <Icon name="cloud-sun" size={28} className="text-amber-500" />;
        return <Icon name="sun" size={28} className="text-amber-500" />;
      };

      const validHealthLogs = useMemo(() => allLogs.filter(l => l.mood > 0 || l.migraine > 0 || l.sleepHours || l.hadBeverage === 'drank'), [allLogs]);
      const displayedHealthLogs = showAllHealthLogs ? validHealthLogs : validHealthLogs.slice(0, 5);
      const displayedDiaries = showAllDiaries ? diaries : diaries.slice(0, 5);

      if (isLoading) return <div className="min-h-screen flex items-center justify-center bg-slate-50 text-indigo-500 text-lg font-medium tracking-wide">載入中...</div>;

      return (
        <div className="min-h-screen bg-slate-50 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-50/60 via-slate-50 to-sky-50/40 font-sans text-gray-800 pb-32">
          
          <header className="px-6 pt-12 pb-4 max-w-lg mx-auto relative z-10 flex justify-between items-end">
            <div className="space-y-1">
              <p className="text-sm font-bold text-indigo-500 tracking-wider uppercase flex items-center gap-1.5">
                <Icon name="calendar" size={16} className="text-indigo-400" />
                {getFormattedDate()}
              </p>
              <h1 className="text-3xl font-extrabold text-gray-800 tracking-tight">{getGreeting()}</h1>
            </div>
            
            <div className="flex items-center gap-3 bg-white/80 backdrop-blur-md border border-slate-200/80 px-4 py-2 rounded-2xl shadow-sm">
              {renderWeatherIcon()}
              <div className="flex flex-col">
                <span className="text-xl font-bold text-gray-700 leading-none">
                  {weather.temp !== '--' ? `${weather.temp}°` : '--'}
                </span>
                <span className="text-[13px] font-semibold text-gray-500 mt-0.5">{weather.text}</span>
              </div>
            </div>
          </header>

          <main className="p-4 max-w-lg mx-auto space-y-6">
            
            {activeTab === 'today' && (
              <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                
                <section className="bg-gradient-to-b from-indigo-50/60 to-white backdrop-blur-xl rounded-[24px] p-6 shadow-sm border border-indigo-100/80 space-y-5">
                  <div>
                    <div className="flex items-center justify-between">
                      <h2 className="text-xl font-bold flex items-center gap-2 text-indigo-950">
                        <Icon name="target" size={24} className="text-indigo-500"/> 長期計畫
                      </h2>
                      <span className="text-sm font-semibold text-indigo-500/80 bg-indigo-100/70 px-3 py-1 rounded-full">
                        {plans.length} 項
                      </span>
                    </div>
                    <p className="text-sm text-gray-500 mt-2 font-medium">設定你的北極星，將大目標拆解執行。</p>
                  </div>

                  <form onSubmit={addPlan} className="flex gap-2">
                    <input
                      type="text" value={newPlan} onChange={(e) => setNewPlan(e.target.value)}
                      placeholder="輸入新的長期目標..."
                      className="flex-1 min-w-0 bg-white border border-indigo-200/80 rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 outline-none text-base font-medium transition-all shadow-sm"
                    />
                    <button type="submit" className="shrink-0 bg-indigo-600 text-white w-14 py-3.5 rounded-xl shadow-sm hover:bg-indigo-700 active:scale-95 transition-all flex items-center justify-center">
                      <Icon name="plus" size={22} className="text-white" />
                    </button>
                  </form>

                  <div className="space-y-3">
                    {plans.map(plan => (
                      <div key={plan.id} className="p-4 bg-white/90 border border-indigo-100 rounded-xl shadow-sm space-y-3">
                        <div className="flex items-center justify-between gap-2">
                          <h3 className="font-semibold text-gray-800 text-lg truncate">{plan.title}</h3>
                          <div className="flex items-center gap-3 shrink-0">
                            <span className="text-sm font-bold text-indigo-600 bg-indigo-50 border border-indigo-100 px-2 py-1 rounded-md">
                              {plan.progress}%
                            </span>
                            <button onClick={() => deletePlan(plan.id)} className="text-gray-400 hover:text-red-500 p-1.5 bg-red-50/50 rounded-full">
                              <Icon name="x" size={18} />
                            </button>
                          </div>
                        </div>
                        <input 
                          type="range" min="0" max="100" value={plan.progress} onChange={(e) => updatePlanProgress(plan.id, parseInt(e.target.value))}
                          className="w-full h-3 rounded-lg appearance-none cursor-pointer accent-indigo-600 bg-slate-200"
                          style={{ background: `linear-gradient(to right, #4f46e5 0%, #4f46e5 ${plan.progress}%, #e2e8f0 ${plan.progress}%, #e2e8f0 100%)` }}
                        />
                      </div>
                    ))}
                    {plans.length === 0 && (
                      <div className="text-center py-5 bg-white/60 rounded-xl border border-dashed border-indigo-200 text-base font-medium text-gray-400">目前沒有設定計畫，快來新增吧！</div>
                    )}
                  </div>
                </section>

                <section className="bg-gradient-to-b from-slate-50/80 to-white backdrop-blur-xl rounded-[24px] p-6 shadow-sm border border-slate-200 space-y-5">
                  <h2 className="text-xl font-bold flex items-center gap-2 text-slate-800">
                    <Icon name="check" size={24} className="text-slate-700"/> 任務與習慣
                  </h2>
                  
                  <form onSubmit={addItem} className="flex gap-2">
                    <select
                      value={newItemType} onChange={(e) => setNewItemType(e.target.value)}
                      className="shrink-0 w-[110px] bg-white border border-slate-200 rounded-xl px-2 py-3.5 text-base font-semibold text-slate-700 outline-none focus:ring-2 focus:ring-slate-200 transition-all shadow-sm"
                    >
                      <option value="habit">每日打卡</option>
                      <option value="todo">臨時待辦</option>
                    </select>
                    <input
                      type="text" value={newItemText} onChange={(e) => setNewItemText(e.target.value)}
                      placeholder={newItemType === 'habit' ? "新增習慣..." : "新增待辦..."}
                      className="flex-1 min-w-0 bg-white border border-slate-200 rounded-xl px-3 py-3.5 focus:ring-2 focus:ring-slate-200 outline-none text-base font-medium transition-all shadow-sm"
                    />
                    <button type="submit" className="shrink-0 bg-slate-800 text-white w-14 py-3.5 rounded-xl shadow-sm hover:bg-slate-900 active:scale-95 transition-all flex items-center justify-center">
                      <Icon name="plus" size={22} className="text-white" />
                    </button>
                  </form>

                  <div className="bg-emerald-50/40 border border-emerald-100 rounded-2xl p-5 space-y-4">
                    <div className="flex items-center justify-between">
                      <h3 className="text-sm font-bold text-emerald-800 uppercase flex items-center gap-1.5">
                        <Icon name="sparkles" size={18} className="text-emerald-500" />每日打卡
                      </h3>
                      <span className="text-sm font-semibold text-emerald-700/80">已完成 {habits.filter(h => (todayLog.completedHabits || []).includes(h.id)).length} / {habits.length}</span>
                    </div>
                    <ul className="space-y-3">
                      {habits.map(habit => {
                        const isCompleted = (todayLog.completedHabits || []).includes(habit.id);
                        return (
                          <li key={habit.id} className="flex items-center gap-3 p-3.5 rounded-xl bg-white border border-emerald-100/70 shadow-sm">
                            <button onClick={() => toggleHabit(habit.id)} className={`w-7 h-7 shrink-0 rounded-full border-2 flex items-center justify-center ${isCompleted ? 'bg-emerald-500 border-emerald-500' : 'border-gray-300'}`}>
                              <Icon name="check" size={16} className={isCompleted ? "text-white" : "text-transparent"} />
                            </button>

            )}

          </main>

          <nav className="fixed bottom-6 left-0 right-0 z-50 px-6 max-w-lg mx-auto">
            <div className="flex justify-around items-center h-20 bg-white/95 backdrop-blur-xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] rounded-full px-2 border border-slate-200">
              {[ { id: 'today', name: 'home', label: '今日' }, { id: 'health', name: 'activity', label: '身心' }, { id: 'journal', name: 'book', label: '日記' }, { id: 'insights', name: 'line-chart', label: '分析' } ].map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`relative flex flex-col items-center justify-center w-full h-full space-y-1.5 transition-all duration-300 ${activeTab === tab.id ? 'text-indigo-600' : 'text-gray-400 hover:text-gray-600'}`}>
                  <Icon name={tab.name} size={28} className={`transition-transform duration-300 ${activeTab === tab.id ? 'scale-110 -translate-y-1' : ''}`} />
                  <span className={`text-sm font-bold transition-opacity duration-300 ${activeTab === tab.id ? 'opacity-100' : 'opacity-0 absolute'}`}>{tab.label}</span>
                  {activeTab === tab.id && <div className="absolute bottom-1.5 w-1.5 h-1.5 bg-indigo-600 rounded-full"></div>}
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
