<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LifeTracker</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 Lucide Icons (Web Font 版) -->
  <link rel="stylesheet" href="https://unpkg.com/lucide-static@0.263.1/font/lucide.css">

  <!-- 載入 React 相關 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* 隱藏滾動條但保留滾動功能 */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 antialiased text-gray-800">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 模擬 Firebase 相關函數 (因為沒有後端，改為使用 localStorage 來模擬)
    // 這樣你在手機上用 Safari 開啟時，資料會存在你的手機瀏覽器裡
    const db = {}; 
    const mockUser = { uid: 'local-user' };

    // --- 輔助函數 ---
    const getTodayString = () => {
      const today = new Date();
      return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    };

    const getFormattedDate = () => {
      const options = { month: 'long', day: 'numeric', weekday: 'long' };
      return new Date().toLocaleDateString('zh-TW', options);
    };

    const getGreeting = () => {
      const hour = new Date().getHours();
      if (hour < 5) return '夜深了，早點休息';
      if (hour < 12) return '早安，充滿活力';
      if (hour < 18) return '午安，繼續加油';
      return '晚安，放鬆一下';
    };

    // 簡易的 Icon 替代方案，使用 lucide css 類別或 emoji
    const Icon = ({ name, size=24, className="" }) => {
       const iconMap = {
           'home': '🏠', 'target': '🎯', 'book': '📖', 'line-chart': '📈',
           'plus': '➕', 'check': '✔️', 'x': '✖️', 'moon': '🌙',
           'brain': '🧠', 'smile': '😊', 'activity': '💓', 'sun': '☀️',
           'cloud': '☁️', 'cloud-sun': '⛅', 'cloud-rain': '🌧️', 'cloud-lightning': '⛈️',
           'clock': '🕒', 'pill': '💊', 'zap': '⚡', 'calendar': '📅',
           'sparkles': '✨', 'chevron-down': '🔽', 'chevron-up': '🔼',
           'history': '🕰️', 'edit-3': '✏️', 'coffee': '☕'
       };
       return <span className={className} style={{ fontSize: `${size}px`, lineHeight: 1 }}>{iconMap[name.toLowerCase()] || name}</span>;
    }

    const MOODS = [
      { value: 1, emoji: '😭', label: '極差' },
      { value: 2, emoji: '😕', label: '不好' },
      { value: 3, emoji: '😐', label: '平靜' },
      { value: 4, emoji: '🙂', label: '不錯' },
      { value: 5, emoji: '🤩', label: '極佳' }
    ];

    const MIGRAINE_LEVELS = [
      { value: 0, label: '無', color: 'bg-emerald-50 text-emerald-600 border-emerald-200 hover:bg-emerald-100' },
      { value: 1, label: '輕微', color: 'bg-amber-50 text-amber-600 border-amber-200 hover:bg-amber-100' },
      { value: 2, label: '中度', color: 'bg-orange-50 text-orange-600 border-orange-200 hover:bg-orange-100' },
      { value: 3, label: '嚴重', color: 'bg-rose-50 text-rose-600 border-rose-200 hover:bg-rose-100' }
    ];

    const BEVERAGE_OPTIONS = [
      { id: 'milktea', label: '奶茶', emoji: '🧋' },
      { id: 'coffee', label: '咖啡', emoji: '☕' },
      { id: 'fruit_tea', label: '果茶', emoji: '🍹' }
    ];

    function App() {
      const [user, setUser] = useState(mockUser);
      const [activeTab, setActiveTab] = useState('today');
      const [isLoading, setIsLoading] = useState(true);

      const [weather, setWeather] = useState({ temp: '--', text: '載入中', code: 0 });

      // 使用 localStorage 模擬數據狀態
      const [todayLog, setTodayLog] = useState({ 
        mood: 0, migraine: 0, sleepHours: '', diary: '', completedHabits: [],
        hadBeverage: 'none', beverageName: '', beverageTime: ''
      });
      const [todos, setTodos] = useState([]);
      const [habits, setHabits] = useState([]);
      const [plans, setPlans] = useState([]);
      const [allLogs, setAllLogs] = useState([]);
      const [diaries, setDiaries] = useState([]); 

      const [showAllHealthLogs, setShowAllHealthLogs] = useState(false);
      const [showAllDiaries, setShowAllDiaries] = useState(false);

      const [newItemType, setNewItemType] = useState('habit');
      const [newItemText, setNewItemText] = useState('');
      const [newPlan, setNewPlan] = useState('');
      const [saveStatus, setSaveStatus] = useState('');
      const [diaryInput, setDiaryInput] = useState(''); 
      const [editingDiaryId, setEditingDiaryId] = useState(null); 
      const [medicationInput, setMedicationInput] = useState('');
      const [migraineTimeInput, setMigraineTimeInput] = useState('');
      const [migraineTriggerInput, setMigraineTriggerInput] = useState('');
      const [beverageTimeInput, setBeverageTimeInput] = useState('');

      const todayStr = getTodayString();

      // --- 本地存儲存取邏輯 (取代 Firebase) ---
      const saveData = (key, data) => {
        localStorage.setItem(`lifetracker_${key}`, JSON.stringify(data));
      };

      const loadData = (key, defaultData) => {
        const saved = localStorage.getItem(`lifetracker_${key}`);
        return saved ? JSON.parse(saved) : defaultData;
      };

      // 初始化載入資料
      useEffect(() => {
        const loadedLogs = loadData('daily_logs', []);
        setAllLogs(loadedLogs);
        
        const todayData = loadedLogs.find(l => l.id === todayStr) || { 
          id: todayStr, mood: 0, migraine: 0, sleepHours: '', completedHabits: [], hadBeverage: 'none', beverageName: '', beverageTime: ''
        };
        setTodayLog(todayData);

        setTodos(loadData('todos', []));
        setHabits(loadData('habits', []));
        setPlans(loadData('plans', []));
        setDiaries(loadData('diaries', []));
        setIsLoading(false);
      }, []);

      // 儲存 todayLog
      useEffect(() => {
        if(isLoading) return;
        const newLogs = allLogs.filter(l => l.id !== todayStr);
        newLogs.push({...todayLog, id: todayStr});
        setAllLogs(newLogs.sort((a, b) => b.id.localeCompare(a.id)));
        saveData('daily_logs', newLogs);
      }, [todayLog]);

      // 儲存其他陣列資料
      useEffect(() => { if(!isLoading) saveData('todos', todos); }, [todos]);
      useEffect(() => { if(!isLoading) saveData('habits', habits); }, [habits]);
      useEffect(() => { if(!isLoading) saveData('plans', plans); }, [plans]);
      useEffect(() => { if(!isLoading) saveData('diaries', diaries); }, [diaries]);


      useEffect(() => {
        const fetchWeather = async (lat = 25.0330, lon = 121.5654) => {
          try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            const current = data.current_weather;
            if (current) {
              const code = current.weathercode;
              let text = '晴朗';
              if ([1, 2].includes(code)) text = '多雲時晴';
              else if (code === 3) text = '陰天';
              else if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) text = '降雨';
              else if ([95, 96, 99].includes(code)) text = '雷雨';
              setWeather({ temp: Math.round(current.temperature), text, code });
            }
          } catch {
            setWeather({ temp: '26', text: '晴朗', code: 0 });
          }
        };

        if ('geolocation' in navigator) {
          navigator.geolocation.getCurrentPosition(
            (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude),
            () => fetchWeather()
          );
        } else {
          fetchWeather();
        }
      }, []);

      useEffect(() => {
        setMedicationInput(todayLog.migraineMedication || '');
        setMigraineTimeInput(todayLog.migraineStartTime || '');
        setMigraineTriggerInput(todayLog.migraineTrigger || '');
        setBeverageTimeInput(todayLog.beverageTime || '');
      }, [
        todayLog.migraineMedication, 
        todayLog.migraineStartTime, 
        todayLog.migraineTrigger,
        todayLog.beverageTime
      ]);

      const updateTodayLog = (field, value) => {
        setTodayLog(prev => ({ ...prev, [field]: value }));
      };

      const selectBeverage = (beverageLabel) => {
        setTodayLog(prev => ({ ...prev, hadBeverage: 'drank', beverageName: beverageLabel }));
      };

      const saveDiary = () => {
        if (!diaryInput.trim()) return;
        setSaveStatus('儲存中...');
        
        if (editingDiaryId) {
           setDiaries(prev => prev.map(d => d.id === editingDiaryId ? { ...d, text: diaryInput.trim(), updatedAt: Date.now() } : d));
           setEditingDiaryId(null);
        } else {
           const newDiary = { id: Date.now().toString(), text: diaryInput.trim(), date: todayStr, createdAt: Date.now() };
           setDiaries(prev => [newDiary, ...prev]);
        }
        
        setDiaryInput('');
        setSaveStatus('已儲存');
        setTimeout(() => setSaveStatus(''), 3000);
        
        setTimeout(() => {
          const historySection = document.getElementById('diary-history');
          if (historySection) historySection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
      };

      const editDiary = (diary) => {
        setDiaryInput(diary.text);
        setEditingDiaryId(diary.id);
        window.scrollTo({ top: 0, behavior: 'smooth' }); 
      };

      const deleteDiaryItem = (id) => {
        setDiaries(prev => prev.filter(d => d.id !== id));
      };

      const addItem = (e) => {
        e.preventDefault();
        if (!newItemText.trim()) return;
        
        if (newItemType === 'todo') {
           const newTodo = { id: Date.now().toString(), text: newItemText.trim(), completed: false, createdAt: Date.now(), date: todayStr };
           setTodos(prev => [newTodo, ...prev]);
        } else {
           const newHabit = { id: Date.now().toString(), text: newItemText.trim(), createdAt: Date.now() };
           setHabits(prev => [...prev, newHabit]);
        }
        setNewItemText('');
      };

      const toggleHabit = (habitId) => {
        const currentCompleted = todayLog.completedHabits || [];
        const isCompleted = currentCompleted.includes(habitId);
        const newCompleted = isCompleted 
          ? currentCompleted.filter(id => id !== habitId)
          : [...currentCompleted, habitId];
        updateTodayLog('completedHabits', newCompleted);
      };

      const deleteHabit = (id) => {
         setHabits(prev => prev.filter(h => h.id !== id));
      };

      const toggleTodo = (id) => {
         setTodos(prev => prev.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const deleteTodo = (id) => {
         setTodos(prev => prev.filter(t => t.id !== id));
      };

      const addPlan = (e) => {
        e.preventDefault();
        if (!newPlan.trim()) return;
        const p = { id: Date.now().toString(), title: newPlan.trim(), progress: 0, createdAt: Date.now() };
        setPlans(prev => [p, ...prev]);
        setNewPlan('');
      };

      const updatePlanProgress = (id, progress) => {
         setPlans(prev => prev.map(p => p.id === id ? { ...p, progress } : p));
      };

      const deletePlan = (id) => {
         setPlans(prev => prev.filter(p => p.id !== id));
      };

      const insights = useMemo(() => {
        if (allLogs.length === 0) return null;

        let totalSleep = 0, sleepCount = 0;
        let migraineDays = 0;
        let moodSum = 0, moodCount = 0;
        
        let sleepWithMigraine = [];
        let sleepWithoutMigraine = [];

        allLogs.forEach(log => {
          const sleep = parseFloat(log.sleepHours);
          if (!isNaN(sleep) && sleep > 0) {
            totalSleep += sleep;
            sleepCount++;
            
            if (log.migraine > 0) {
              sleepWithMigraine.push(sleep);
            } else {
              sleepWithoutMigraine.push(sleep);
            }
          }
          
          if (log.migraine > 0) migraineDays++;
          
          if (log.mood > 0) {
            moodSum += log.mood;
            moodCount++;
          }
        });

        const avgSleep = sleepCount > 0 ? (totalSleep / sleepCount).toFixed(1) : 0;
        const avgMood = moodCount > 0 ? (moodSum / moodCount).toFixed(1) : 0;
        
        const avgSleepMigraine = sleepWithMigraine.length > 0 
          ? (sleepWithMigraine.reduce((a,b)=>a+b,0) / sleepWithMigraine.length).toFixed(1) 
          : '無數據';
        const avgSleepNoMigraine = sleepWithoutMigraine.length > 0 
          ? (sleepWithoutMigraine.reduce((a,b)=>a+b,0) / sleepWithoutMigraine.length).toFixed(1) 
          : '無數據';

        return {
          totalDays: allLogs.length,
          avgSleep,
          migraineRate: Math.round((migraineDays / allLogs.length) * 100) || 0,
          avgMood,
          correlation: { avgSleepMigraine, avgSleepNoMigraine }
        };
      }, [allLogs]);

      const renderWeatherIcon = () => {
        const code = weather.code;
        if ([95, 96, 99].includes(code)) return <Icon name="cloud-lightning" size={22} className="text-indigo-500" />;
        if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return <Icon name="cloud-rain" size={22} className="text-blue-500" />;
        if (code === 3) return <Icon name="cloud" size={22} className="text-slate-400" />;
        if ([1, 2].includes(code)) return <Icon name="cloud-sun" size={22} className="text-amber-500" />;
        return <Icon name="sun" size={22} className="text-amber-500" />;
      };

      const validHealthLogs = useMemo(() => {
        return allLogs.filter(l => l.mood > 0 || l.migraine > 0 || l.sleepHours || l.hadBeverage === 'drank');
      }, [allLogs]);

      const displayedHealthLogs = showAllHealthLogs ? validHealthLogs : validHealthLogs.slice(0, 5);
      const displayedDiaries = showAllDiaries ? diaries : diaries.slice(0, 5);

      if (isLoading) return <div className="min-h-screen flex items-center justify-center bg-slate-50 text-indigo-500 font-medium tracking-wide">載入中...</div>;

      return (
        <div className="min-h-screen bg-slate-50 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-50/60 via-slate-50 to-sky-50/40 font-sans text-gray-800 pb-32 selection:bg-indigo-100">
          
          {/* 頂部總覽區 */}
          <header className="px-6 pt-12 pb-3 max-w-lg mx-auto relative z-10 flex justify-between items-end">
            <div className="space-y-1">
              <p className="text-xs font-semibold text-indigo-500 tracking-wider uppercase flex items-center gap-1.5">
                <Icon name="calendar" size={13} className="text-indigo-400" />
                {getFormattedDate()}
              </p>
              <h1 className="text-2xl font-extrabold text-gray-800 tracking-tight">{getGreeting()}</h1>
            </div>
            
            {/* 即時天氣膠囊 */}
            <div className="flex items-center gap-2.5 bg-white/80 backdrop-blur-md border border-slate-200/80 px-3.5 py-1.5 rounded-2xl shadow-sm">
              {renderWeatherIcon()}
              <div className="flex flex-col">
                <span className="text-sm font-bold text-gray-700 leading-none">
                  {weather.temp !== '--' ? `${weather.temp}°` : '--'}
                </span>
                <span className="text-[10px] font-semibold text-gray-400 mt-0.5">{weather.text}</span>
              </div>
            </div>
          </header>

          <main className="p-4 max-w-lg mx-auto space-y-5">
            
            {/* ================= TODAY 頁面 ================= */}
            {activeTab === 'today' && (
              <div className="space-y-5 animate-in fade-in slide-in-from-bottom-4 duration-500">
                
                {/* 模塊 1: 長期計畫 */}
                <section className="bg-gradient-to-b from-indigo-50/60 to-white backdrop-blur-xl rounded-[24px] p-5 shadow-sm border border-indigo-100/80 space-y-4">
                  <div>
                    <div className="flex items-center justify-between">
                      <h2 className="text-base font-bold flex items-center gap-2 text-indigo-950">
                        <Icon name="target" size={20} className="text-indigo-500"/> 長期計畫
                      </h2>
                      <span className="text-[11px] font-semibold text-indigo-500/80 bg-indigo-100/70 px-2 py-0.5 rounded-full">
                        {plans.length} 項
                      </span>
                    </div>
                    <p className="text-xs text-gray-500 mt-1 font-medium">設定你的北極星，將大目標拆解執行。</p>
                  </div>

                  {/* 輸入框 */}
                  <form onSubmit={addPlan} className="flex gap-2">
                    <input
                      type="text"
                      value={newPlan}
                      onChange={(e) => setNewPlan(e.target.value)}
                      placeholder="輸入新的長期目標..."
                      className="flex-1 bg-white border border-indigo-200/80 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 outline-none text-sm font-medium transition-all placeholder-gray-400 shadow-sm"
                    />
                    <button type="submit" className="bg-indigo-600 text-white px-3.5 py-2.5 rounded-xl shadow-sm hover:bg-indigo-700 active:scale-95 transition-all flex items-center justify-center">
                      <Icon name="plus" size={18} />
                    </button>
                  </form>

                  {/* 計畫列表 */}
                  <div className="space-y-2.5">
                    {plans.map(plan => (
                      <div key={plan.id} className="p-3 bg-white/90 border border-indigo-100 rounded-xl shadow-sm hover:border-indigo-300 transition-all group space-y-2">
                        <div className="flex items-center justify-between gap-2">
                          <h3 className="font-semibold text-gray-800 text-sm truncate">{plan.title}</h3>
                          <div className="flex items-center gap-2 shrink-0">
                            <span className="text-xs font-bold text-indigo-600 bg-indigo-50 border border-indigo-100 px-2 py-0.5 rounded-md">
                              {plan.progress}%
                            </span>
                            <button onClick={() => deletePlan(plan.id)} className="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-0.5 hover:bg-red-50 rounded-full">
                              <Icon name="x" size={14} />
                            </button>
                          </div>
                        </div>
                        
                        {/* 進度拉桿 */}
                        <div className="relative flex items-center">
                          <input 
                            type="range" 
                            min="0" max="100" 
                            value={plan.progress} 
                            onChange={(e) => updatePlanProgress(plan.id, parseInt(e.target.value))}
                            className="w-full h-2 rounded-lg appearance-none cursor-pointer accent-indigo-600 focus:outline-none"
                            style={{
                              background: `linear-gradient(to right, #4f46e5 0%, #4f46e5 ${plan.progress}%, #e2e8f0 ${plan.progress}%, #e2e8f0 100%)`
                            }}
                          />
                        </div>
                      </div>
                    ))}
                    {plans.length === 0 && (
                      <div className="text-center py-3 bg-white/60 rounded-xl border border-dashed border-indigo-200">
                        <p className="text-xs font-medium text-gray-400">目前沒有設定計畫，快來新增吧！</p>
                      </div>
                    )}
                  </div>
                </section>

                {/* 模塊 2: 任務與習慣 */}
                <section className="bg-gradient-to-b from-slate-50/80 to-white backdrop-blur-xl rounded-[24px] p-5 shadow-sm border border-slate-200 space-y-5">
                  <h2 className="text-base font-bold flex items-center gap-2 text-slate-800">
                    <Icon name="check" size={20} className="text-slate-700"/> 任務與習慣
                  </h2>
                  
                  {/* 統一輸入框 */}
                  <form onSubmit={addItem} className="flex gap-2">
                    <select
                      value={newItemType}
                      onChange={(e) => setNewItemType(e.target.value)}
                      className="bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-semibold text-slate-700 outline-none focus:ring-2 focus:ring-slate-200 focus:border-slate-400 transition-all cursor-pointer shadow-sm"
                    >
                      <option value="habit">每日打卡</option>
                      <option value="todo">臨時待辦</option>
                    </select>
                    <input
                      type="text"
                      value={newItemText}
                      onChange={(e) => setNewItemText(e.target.value)}
                      placeholder={newItemType === 'habit' ? "新增打卡習慣..." : "新增待辦事項..."}
                      className="flex-1 bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-slate-200 focus:border-slate-400 outline-none text-sm font-medium transition-all placeholder-gray-400 text-gray-700 shadow-sm"
                    />
                    <button type="submit" className="bg-slate-800 text-white px-3.5 py-2.5 rounded-xl hover:bg-slate-900 active:scale-95 transition-all shadow-sm flex items-center justify-center">
                      <Icon name="plus" size={18} />
                    </button>
                  </form>

                  {/* 子模塊 2-1: 每日打卡 */}
                  <div className="bg-emerald-50/40 border border-emerald-100 rounded-2xl p-4 space-y-3">
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs font-bold text-emerald-800 uppercase tracking-wider flex items-center gap-1.5">
                        <Icon name="sparkles" size={13} className="text-emerald-500" />
                        每日打卡
                      </h3>
                      <span className="text-[11px] font-semibold text-emerald-700/80">
                        已完成 {habits.filter(h => (todayLog.completedHabits || []).includes(h.id)).length} / {habits.length}
                      </span>
                    </div>
                    
                    <ul className="space-y-2">
                      {habits.map(habit => {
                        const isCompleted = (todayLog.completedHabits || []).includes(habit.id);
                        return (
                          <li key={habit.id} className="flex items-center gap-3 p-2.5 rounded-xl bg-white border border-emerald-100/70 shadow-sm hover:border-emerald-200 transition-all group">
                            <button 
                              onClick={() => toggleHabit(habit.id)}
                              className={`w-5 h-5 flex-shrink-0 rounded-full border-2 flex items-center justify-center transition-all duration-300 ${
                                isCompleted ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-gray-300 text-transparent hover:border-emerald-400'
                              }`}
                            >
                              <Icon name="check" size={12} />
                            </button>
                            <span className={`flex-1 text-sm font-medium transition-all ${isCompleted ? 'line-through text-gray-400' : 'text-gray-700'}`}>
                              {habit.text}
                            </span>

                                <Icon name="edit-3" size={13} />
                              </button>
                              <button 
                                onClick={(e) => { e.stopPropagation(); deleteDiaryItem(diary.id); }} 
                                className="p-1 text-slate-400 hover:text-red-500 hover:bg-white rounded transition-colors"
                                title="刪除"
                              >
                                <Icon name="x" size={13} />
                              </button>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>

                  {/* 展開 / 收起按鈕 */}
                  {diaries.length > 5 && (
                    <button
                      onClick={() => setShowAllDiaries(!showAllDiaries)}
                      className="w-full py-2 bg-slate-50 hover:bg-slate-100 text-slate-500 text-[11px] font-semibold rounded-xl border border-slate-200/80 flex items-center justify-center gap-1 transition-all mt-1"
                    >
                      {showAllDiaries ? (
                        <>
                          <span>收起過往日記</span>
                          <Icon name="chevron-up" size={13} />
                        </>
                      ) : (
                        <>
                          <span>展開更多日記 ({diaries.length - 5} 篇)</span>
                          <Icon name="chevron-down" size={13} />
                        </>
                      )}
                    </button>
                  )}
                </section>
              </div>
            )}

            {/* ================= INSIGHTS 頁面 ================= */}
            {activeTab === 'insights' && (
              <div className="space-y-5 animate-in fade-in slide-in-from-bottom-4 duration-500">
                <section className="bg-white backdrop-blur-xl rounded-[24px] p-5 shadow-sm border border-slate-200 space-y-6">
                  <h2 className="text-base font-bold flex items-center gap-2 text-gray-800">
                    <Icon name="brain" size={20} className="text-indigo-500"/> 數據洞察
                  </h2>

                  {!insights ? (
                    <div className="text-center py-10 bg-slate-50 rounded-xl border border-dashed border-slate-200">
                      <p className="text-xs font-medium text-gray-400">資料收集中，記錄幾天後再來看看分析吧！</p>
                    </div>
                  ) : (
                    <div className="space-y-6">
                      {/* 核心數據卡片模塊 */}
                      <div className="grid grid-cols-2 gap-3.5">
                        <div className="bg-gradient-to-br from-indigo-500 to-indigo-600 rounded-2xl p-4 text-center shadow-sm text-white relative overflow-hidden border border-indigo-400/30">
                          <div className="absolute -right-3 -bottom-3 opacity-20"><Icon name="moon" size={65}/></div>
                          <div className="text-3xl font-bold mb-0.5">{insights.avgSleep} <span className="text-sm font-medium opacity-80">h</span></div>
                          <div className="text-[10px] font-semibold tracking-wider uppercase opacity-90">平均睡眠</div>
                        </div>
                        <div className="bg-gradient-to-br from-rose-500 to-orange-500 rounded-2xl p-4 text-center shadow-sm text-white relative overflow-hidden border border-rose-400/30">
                          <div className="absolute -right-3 -bottom-3 opacity-20"><Icon name="activity" size={65}/></div>
                          <div className="text-3xl font-bold mb-0.5">{insights.migraineRate}<span className="text-sm font-medium opacity-80">%</span></div>
                          <div className="text-[10px] font-semibold tracking-wider uppercase opacity-90">偏頭痛機率</div>
                        </div>
                      </div>

                      {/* 交叉分析模塊 */}
                      <div className="bg-slate-50/70 rounded-2xl p-4 space-y-3 border border-slate-200">
                        <h3 className="font-bold text-slate-800 text-xs flex items-center gap-1.5">
                          <Icon name="line-chart" size={15} className="text-indigo-500" /> 交叉關聯分析
                        </h3>
                        
                        <div className="space-y-2 text-xs text-gray-600">
                          <div className="flex justify-between items-center bg-white p-2.5 rounded-xl border border-slate-100">
                            <span className="font-medium">發作偏頭痛時，平均睡眠</span>
                            <span className="text-base font-bold text-rose-600">{insights.correlation.avgSleepMigraine} <span className="text-xs text-rose-300">h</span></span>
                          </div>
                          <div className="flex justify-between items-center bg-white p-2.5 rounded-xl border border-slate-100">
                            <span className="font-medium">無偏頭痛時，平均睡眠</span>
                            <span className="text-base font-bold text-emerald-600">{insights.correlation.avgSleepNoMigraine} <span className="text-xs text-emerald-300">h</span></span>
                          </div>
                          
                          {insights.correlation.avgSleepMigraine !== '無數據' && insights.correlation.avgSleepNoMigraine !== '無數據' && (
                            <div className="text-[11px] font-medium text-indigo-700 mt-2 bg-indigo-50/80 p-2.5 rounded-xl border border-indigo-100 leading-relaxed text-center">
                              💡 系統觀察：這可能暗示了睡眠時間與你的偏頭痛頻率存在關聯性。
                            </div>
                          )}
                        </div>
                      </div>

                      {/* 最近 7 天紀錄模塊 */}
                      <div className="space-y-3">
                        <h3 className="font-bold text-slate-800 text-xs">最近 7 天紀錄</h3>
                        <div className="flex gap-2.5 overflow-x-auto pb-2 snap-x hide-scrollbar">
                          {allLogs.slice(0, 7).map(log => (
                            <div key={log.id} className="snap-center shrink-0 w-14 text-center">
                              <div className="text-[10px] font-semibold text-gray-400 mb-1.5 uppercase">{log.id.slice(5)}</div>
                              <div className="h-16 w-full bg-slate-50 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center gap-1.5 transition-all hover:scale-105">
                                <span className="text-lg">{MOODS.find(m => m.value === log.mood)?.emoji || '➖'}</span>
                                {log.migraine > 0 && <div className="w-2 h-2 rounded-full bg-rose-400"></div>}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </section>
              </div>
            )}

          </main>

          {/* 懸浮底部導覽列 */}
          <nav className="fixed bottom-6 left-0 right-0 z-50 px-6 max-w-lg mx-auto">
            <div className="flex justify-around items-center h-16 bg-white/90 backdrop-blur-xl shadow-lg shadow-slate-200/50 rounded-full px-2 border border-slate-200">
              {[
                { id: 'today', name: 'home', label: '今日' },
                { id: 'health', name: 'activity', label: '身心' },
                { id: 'journal', name: 'book', label: '日記' },
                { id: 'insights', name: 'line-chart', label: '分析' },
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`relative flex flex-col items-center justify-center w-full h-full space-y-1 transition-all duration-300
                    ${activeTab === tab.id ? 'text-indigo-600' : 'text-gray-400 hover:text-gray-600'}
                  `}
                >
                  <Icon name={tab.name} size={22} className={`transition-transform duration-300 ${activeTab === tab.id ? 'scale-110 -translate-y-1' : ''}`} />
                  <span className={`text-[10px] font-semibold transition-opacity duration-300 ${activeTab === tab.id ? 'opacity-100' : 'opacity-0 absolute'}`}>{tab.label}</span>
                  {activeTab === tab.id && (
                    <div className="absolute bottom-1 w-1 h-1 bg-indigo-600 rounded-full"></div>
                  )}
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
